<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АгроМаркет - Каталог</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>АгроМаркет</h1>
            <div id="auth-buttons">
                <div id="user-info" style="display: none;">
                    <span id="username"></span>
                    <button id="logout-btn">Выйти</button>
                </div>
                <div id="guest-buttons">
                    <button id="login-btn">Вход</button>
                    <button id="register-btn">Регистрация</button>
                </div>
            </div>
        </header>
        
        <nav>
            <a href="index.html">Каталог</a>
            <a href="orders.html" id="orders-link" style="display: none;">Мои заказы</a>
            <a href="admin.html" id="admin-link" style="display: none;">Админ-панель</a>
            <button id="cart-btn" style="display: none;">Корзина (<span id="cart-count">0</span>)</button>
        </nav>
        
        <main>
            <div id="catalog">
                <h2>Каталог техники</h2>
                <div id="machines-list"></div>
            </div>
        </main>
        
        <div id="cart-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Корзина</h2>
                <div id="cart-items"></div>
                <div id="cart-total">Итого: 0 руб.</div>
                <button id="checkout-btn" style="display: none;">Оформить заказ</button>
            </div>
        </div>
        
        <div id="auth-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="login-form">
                    <h2>Вход</h2>
                    <input type="text" id="login-username" placeholder="Логин">
                    <input type="password" id="login-password" placeholder="Пароль">
                    <button id="login-submit">Войти</button>
                    <p>Нет аккаунта? <a href="#" id="switch-to-register">Зарегистрироваться</a></p>
                </div>
                <div id="register-form" style="display: none;">
                    <h2>Регистрация</h2>
                    <label>Логин:</label>
                    <input type="text" id="register-username" placeholder="Например: user123">
                    <label>Email:</label>
                    <input type="email" id="register-email" placeholder="user@example.com">
                    <label>Имя:</label>
                    <input type="text" id="register-name" placeholder="Полное имя">
                    <label>Возраст (необязательно):</label>
                    <input type="number" id="register-age" placeholder="Например: 25" min="0" max="150">
                    <label>Пароль:</label>
                    <input type="password" id="register-password" placeholder="минимум 6 символов">
                    <button id="register-submit">Зарегистрироваться</button>
                    <p>Уже есть аккаунт? <a href="#" id="switch-to-login">Войти</a></p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
