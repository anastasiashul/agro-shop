<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АгроМаркет - Мои заказы</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>АгроМаркет</h1>
            <div id="user-info">
                <span id="username"></span>
                <button id="logout-btn">Выйти</button>
            </div>
        </header>
        
        <nav>
            <a href="index.html">Каталог</a>
            <a href="orders.html">Мои заказы</a>
            <a href="admin.html" id="admin-link" style="display: none;">Админ-панель</a>
            <button id="cart-btn">Корзина (<span id="cart-count">0</span>)</button>
        </nav>
        
        <main>
            <h2>Мои заказы</h2>
            <div id="orders-list"></div>
        </main>
        
        <div id="cart-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Корзина</h2>
                <div id="cart-items"></div>
                <div id="cart-total">Итого: 0 руб.</div>
                <button id="checkout-btn" style="display: none;">Оформить заказ</button>
            </div>
        </div>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
