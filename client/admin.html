<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АгроМаркет - Админ-панель</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>АгроМаркет</h1>
            <div id="user-info">
                <span id="username"></span>
                <button id="logout-btn">Выйти</button>
            </div>
        </header>
        
        <nav>
            <a href="index.html">Каталог</a>
            <a href="orders.html">Мои заказы</a>
            <a href="admin.html">Админ-панель</a>
            <button id="cart-btn">Корзина (<span id="cart-count">0</span>)</button>
        </nav>
        
        <main>
            <h2>Админ-панель</h2>
            <div id="admin-tabs">
                <button class="tab-btn" data-tab="machines">Управление техникой</button>
                <button class="tab-btn" data-tab="users">Пользователи</button>
                <button class="tab-btn" data-tab="all-orders">Все заказы</button>
                <button class="tab-btn" data-tab="stats">Статистика</button>
            </div>
            <div id="admin-machines" class="admin-tab">
                <button id="add-machine-btn">Добавить технику</button>
                <div id="admin-machines-list"></div>
            </div>
            <div id="admin-users" class="admin-tab">
                <button id="add-user-btn">Создать пользователя</button>
                <div id="users-list"></div>
            </div>
            <div id="admin-orders" class="admin-tab">
                <div id="admin-filters">
                    <select id="filter-user">
                        <option value="">Все пользователи</option>
                    </select>
                    <select id="filter-status">
                        <option value="">Все статусы</option>
                        <option value="pending">Ожидает оплаты</option>
                        <option value="paid">Оплачен</option>
                        <option value="cancelled">Отменён</option>
                    </select>
                    <button id="apply-filters">Применить</button>
                </div>
                <div id="admin-orders-list"></div>
            </div>
            <div id="admin-stats" class="admin-tab">
                <div id="stats-content">
                    <h3>Статистика по технике</h3>
                    <div id="machines-stats"></div>
                    <h3 style="margin-top: 30px;">Статистика по пользователям</h3>
                    <div id="users-stats"></div>
                </div>
            </div>
        </main>
        
        <div id="cart-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Корзина</h2>
                <div id="cart-items"></div>
                <div id="cart-total">Итого: 0 руб.</div>
                <button id="checkout-btn" style="display: none;">Оформить заказ</button>
            </div>
        </div>
        
        <div id="machine-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="machine-modal-title">Добавить технику</h2>
                <form id="machine-form">
                    <input type="hidden" id="machine-id">
                    <input type="text" id="machine-name" placeholder="Название" required>
                    <select id="machine-category" required>
                        <option value="">Выберите категорию</option>
                        <option value="Тракторы">Тракторы</option>
                        <option value="Комбайны">Комбайны</option>
                        <option value="Плуги">Плуги</option>
                        <option value="Сеялки">Сеялки</option>
                        <option value="Культиваторы">Культиваторы</option>
                    </select>
                    <input type="number" id="machine-price" placeholder="Цена" required>
                    <textarea id="machine-description" placeholder="Описание"></textarea>
                    <input type="number" id="machine-stock" placeholder="Количество" value="0">
                    <button type="submit">Сохранить</button>
                </form>
            </div>
        </div>
        
        <div id="user-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Создать пользователя</h2>
                <form id="user-form" novalidate>
                    <label>Логин</label>
                    <input type="text" id="user-username" placeholder="Логин" autocomplete="off" required>
                    <label>Email</label>
                    <input type="email" id="user-email" placeholder="Email" autocomplete="off" required>
                    <label>Полное имя</label>
                    <input type="text" id="user-name" placeholder="Полное имя" autocomplete="off" required>
                    <label>Возраст (необязательно)</label>
                    <input type="number" id="user-age" placeholder="Возраст" min="0" max="150">
                    <label>Пароль</label>
                    <input type="password" id="user-password" placeholder="Пароль (минимум 6 символов)" autocomplete="off" required>
                    <label>Роль</label>
                    <select id="user-role">
                        <option value="user">Пользователь</option>
                        <option value="admin">Администратор</option>
                    </select>
                    <button type="submit">Создать</button>
                </form>
            </div>
        </div>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/admin-tabs.js"></script>
    <script src="js/admin/admin-common.js"></script>
    <script src="js/admin/admin-machines.js"></script>
    <script src="js/admin/admin-users.js"></script>
    <script src="js/admin/admin-orders.js"></script>
    <script src="js/admin/admin-stats.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
